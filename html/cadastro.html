<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMap - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="logo-container logo-reload auth-header-logo">
            <span class="logo-welcome font-decorative">Bem vindo ao</span>
            <div class="logo-brand font-decorative">
                Fo<span class="pin-icon"></span>dMap!
            </div>
        </div>

        <div class="auth-card">
            <form action="login.html" method="GET">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="nome">Digite seu nome:</label>
                    <input type="text" id="nome" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="email">Digite seu email:</label>
                    <input type="email" id="email" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="senha">Digite sua senha:</label>
                    <input type="password" id="senha" class="form-input" required>
                </div>

                <div class="form-group" style="margin-bottom: 18px;">
                    <label for="confirm-senha">Confirme sua senha:</label>
                    <input type="password" id="confirm-senha" class="form-input" required>
                </div>

                <button type="submit" class="btn-primary-red">Login</button>
            </form>
        </div>

        <div class="auth-footer">
            Já possui uma conta? <a href="login.html">Login</a>
        </div>
    </div>

    <script src="../js/main.js"></script>
</body>
</html>
